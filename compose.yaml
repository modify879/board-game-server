# 프로젝트 이름을 고정한다 — 없으면 디렉터리 이름이 프로젝트가 되어, 전용 실행 워크트리(board-game-run)에서 띄울 때 새 컨테이너·빈 DB 를 만들려다 포트 충돌로 실패한다.
name: board-game

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: board_game
      POSTGRES_USER: board_game
      POSTGRES_PASSWORD: board_game
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board_game -d board_game"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
