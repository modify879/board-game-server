spring:
  application:
    name: board-game

  # 로컬에서는 compose.yaml 의 postgres, redis 가 자동 기동되고
  # 데이터소스와 Redis 접속이 자동으로 연결된다. host/url/username/password 를 적지 않는다.
  docker:
    compose:
      lifecycle-management: start_and_stop

  jpa:
    hibernate:
      # 초기 개발 단계에서만 사용한다. 운영 배포 전 Flyway 로 전환할 것.
      ddl-auto: update
    # 영속성 컨텍스트가 presentation 계층까지 열려 있으면
    # "도메인/JPA 분리" 규칙이 무의미해지므로 끈다.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
