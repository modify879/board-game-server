spring:
  application:
    name: board-game

  # 접속 정보를 적지 않는다 — Docker Compose 지원이 자동으로 연결한다.
  docker:
    compose:
      lifecycle-management: start_and_stop

  datasource:
    hikari:
      # 모든 DB 대기에 상한을 둬 테이블 스레드가 영영 걸리지 않게 한다. lock_timeout < statement_timeout 이라
      # 락 대기는 락 오류로 드러난다. idle_in_transaction 은 앱이 락을 쥔 채 트랜잭션 중간에 멈췄을 때의 안전망이다.
      # 테이블 실행기(테이블당 직렬 스레드)·요청 스레드가 동시에 DB 를 쓰므로 풀이 그 합보다 작으면 대기가 생긴다.
      # 값을 올리면 Postgres max_connections(기본 100) 안에서 올린다.
      maximum-pool-size: 10
      data-source-properties:
        options: "-c lock_timeout=3s -c statement_timeout=10s -c idle_in_transaction_session_timeout=30s"

  devtools:
    # :8080 과 qa(:8081) 서버를 같은 트리에서 동시에 띄우므로 LiveReload 포트(35729) 충돌을 끈다.
    # 운영 jar 에는 devtools 가 없어 이 설정은 무시된다.
    livereload:
      enabled: false

  jackson:
    deserialization:
      # 300.7 같은 소수를 정수 필드(칩·금액)에 조용히 잘라 넣지 않고 거부한다.
      accept-float-as-int: false

  data:
    web:
      pageable:
        # Page 를 그대로 직렬화하면 응답 JSON 이 PageImpl 의 내부 구조에 묶여 계약이 불안정해진다.
        # PagedModel 로 감싸 content 와 page 메타를 분리한다.
        serialization-mode: via_dto
        # size 를 클라이언트가 무한히 키우지 못하게 상한을 둔다(초과 요청은 상한으로 잘린다).
        default-page-size: 20
        max-page-size: 100

  jpa:
    hibernate:
      # 계속 이걸 쓴다. 추가만 하고 지우지 않는다 — data.sql 참고.
      ddl-auto: update
    # 영속성 컨텍스트가 presentation 계층까지 열려 있으면
    # "도메인/JPA 분리" 규칙이 무의미해지므로 끈다.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    # data.sql 이 Hibernate 의 스키마 생성 뒤에 돌아야 한다. 기본값(false)이면 테이블이 없는 상태에서 실행된다.
    defer-datasource-initialization: true

  sql:
    init:
      # 기본값 embedded 는 내장 DB 에서만 실행한다. PostgreSQL 에서도 돌게 always 로 둔다.
      mode: always
      # 기본 구분자 ';' 는 data.sql 의 do $$ ... $$ 블록 안 ';' 에서 잘못 잘린다.
      # 스크립트 안에 나오지 않는 문자열로 바꿔 블록 전체를 한 문장으로 취급하게 한다.
      separator: "@@@"

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

app:
  auth:
    login-max-failures: 5
    login-failure-window: 15m
    # 클라이언트 인밴드 마감(stomp.gd AUTH_DEADLINE_SEC 20초)보다 길게 둔다 — 짧으면 갱신 때 소켓이 교체 전에 끊긴다
    stomp-rotation-grace: 30s
  stomp:
    heartbeat-interval: 10s
  holdem:
    next-hand-delay: 10s
    runout-step-delay: 2s
    turn-timeout: 30s
    idle-table-ttl: 1m
    idle-sweep-interval: 15s
    connection-timeout: 3m
    recovery-timeout: 3m
    rejoin-obligation-window: 30m
    hand-history-retention: 90d
    hand-history-purge-interval: 1d
    # 테이블별 참가 대기열 길이 상한. 넘으면 JOIN_QUEUE_FULL(409). 인메모리라 메모리를 지키는 한계다.
    join-queue-max-length: 50
    # 새 테이블에 적용할 정책. 테이블은 생성 시점의 값을 저장하므로 바꿔도 열린 테이블은 그대로다.
    table-policy:
      small-blind: 100
      big-blind: 200
      min-buy-in-big-blinds: 20
      max-buy-in-big-blinds: 100
  profile-image:
    # 실제 CDN 이 붙기 전까지의 로컬 기본값
    base-url: "http://localhost:8080/images/profiles/"
    default-url: "http://localhost:8080/images/profiles/default.png"
  wallet:
    min-deposit-amount: 1000
    min-withdrawal-amount: 1000
    deposit-account:
      # 실제 계좌가 붙기 전까지의 로컬 기본값
      bank-name: "국민은행"
      account-number: "123456789012"
      account-holder: "홍길동"
  jwt:
    # 운영은 APP_JWT_SECRET 필수(32바이트 이상), 없으면 기동하지 않는다.
    secret: "${APP_JWT_SECRET:}"
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    refresh-reuse-grace: 5s
